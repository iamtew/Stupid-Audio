<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="stack">
    <img id="logo" alt="">
    <h1 id="name"><span class="stroke" aria-hidden="true"></span><span class="fill"></span></h1>
  </div>
  <div id="frame"><img id="shot" alt=""></div>
  <script type="module">
    const overlayCss = `
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 1200px;
        height: 630px;
        z-index: 0;
        pointer-events: none;
      }
      #logo {
        position: absolute;
        left: 10%;
        top: 33%;
        width: 351px;
        height: auto;
        object-fit: contain;
        transform: translateY(-50%);
        z-index: 1;
        filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 60%, transparent));
      }
      #frame {
        position: absolute;
        left: 40%;
        top: 50%;
        width: 50%;
        transform: translateY(-50%);
        perspective: 1400px;
        z-index: 1;
      }
      #shot {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.75rem;
        border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
        box-shadow:
          -18px 18px 60px color-mix(in srgb, var(--accent) 35%, transparent),
          18px -12px 60px color-mix(in srgb, var(--accent2, var(--accent)) 25%, transparent),
          0 30px 60px #000a;
        transform-origin: left center;
        transform: rotateY(-8deg) rotateX(3deg);
      }
      #name {
        position: absolute;
        left: 50%;
        bottom: 28px;
        margin: 0;
        transform: translateX(-50%);
        z-index: 3;
        font-size: 108px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      #name .stroke,
      #name .fill { display: block; }
      #name .stroke {
        position: absolute;
        left: 0;
        top: 0;
        color: #000;
        -webkit-text-stroke: 10px #000;
      }
      #name .fill {
        position: relative;
        filter:
          drop-shadow(0 0 4px #000)
          drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 60%, transparent));
      }
      body.pack {
        background: #0b0b0f;
        color: #f4ead0;
        font: 18px/1.5 system-ui, sans-serif;
      }
      body.pack #frame { display: none; }
      body.pack #stack {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem;
        z-index: 1;
      }
      body.pack #logo,
      body.pack #name {
        position: static;
        transform: none;
        left: auto;
        top: auto;
        bottom: auto;
      }
      body.pack #logo { width: 280px; }
      body.pack #name .stroke { display: none; }
      body.pack #name .fill {
        color: transparent;
        background: linear-gradient(90deg, #e8c200, #d94214, #ff00ff, #6fc3b8, #02f53a);
        -webkit-background-clip: text;
        background-clip: text;
        filter: drop-shadow(0 0 4px #000);
      }
    `;

    const PIXI_URL = 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';
    const INK = 0x0b0b0f;
    const STOPS = [0xe8c200, 0xd94214, 0xff00ff, 0x6fc3b8, 0x02f53a];

    function ramp(x) {
      const t = Math.min(1, Math.max(0, x / 1200)) * (STOPS.length - 1);
      const i = Math.min(STOPS.length - 2, Math.floor(t));
      const f = t - i;
      const a = STOPS[i], b = STOPS[i + 1];
      const ch = (s, sh) => Math.round(((s >> sh) & 255) * (1 - f) + ((b >> sh) & 255) * f);
      return (ch(a, 16) << 16) | (ch(a, 8) << 8) | ch(a, 0);
    }

    function creamGlow(PIXI) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const r = size / 2;
      const grd = g.createRadialGradient(r, r, 0, r, r, r);
      grd.addColorStop(0, 'rgba(244,234,208,0.35)');
      grd.addColorStop(0.45, 'rgba(244,234,208,0.08)');
      grd.addColorStop(1, 'rgba(244,234,208,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      const s = new PIXI.Sprite(PIXI.Texture.from(c));
      s.anchor.set(0.5);
      s.blendMode = 'add';
      return s;
    }

    function hexCenters(R, w, h, pad) {
      const dy = R * Math.sqrt(3) / 2;
      const pts = [];
      let row = 0;
      for (let y = -pad; y <= h + pad; y += dy, row++) {
        const x0 = (row % 2) * (R / 2) - pad;
        for (let x = x0; x <= w + pad; x += R) pts.push([x, y]);
      }
      return pts;
    }

    function metatronCenters(cx, cy, r) {
      const pts = [[cx, cy]];
      for (let ring = 1; ring <= 2; ring++) {
        for (let i = 0; i < 6; i++) {
          const a = -Math.PI / 2 + i * Math.PI / 3;
          pts.push([cx + ring * r * Math.cos(a), cy + ring * r * Math.sin(a)]);
        }
      }
      return pts;
    }

    function strokeCircle(g, x, y, r, color, width, alpha) {
      g.circle(x, y, r).stroke({ width, color, alpha });
    }

    async function packScene() {
      const PIXI = await import(PIXI_URL);
      const app = new PIXI.Application();
      await app.init({
        canvas: document.getElementById('fx'),
        width: 1200,
        height: 630,
        backgroundColor: INK,
        antialias: true,
        preference: 'webgl',
      });

      const R = 72;
      const flower = new PIXI.Container();
      const flowerG = new PIXI.Graphics();
      flowerG.blendMode = 'add';
      hexCenters(R, 1200, 630, R * 3).forEach(([x, y]) => {
        strokeCircle(flowerG, x, y, R, ramp(x), 1, 0.16);
      });
      flower.addChild(flowerG);

      const meta = new PIXI.Container();
      const metaG = new PIXI.Graphics();
      metaG.blendMode = 'add';
      const mR = 88;
      const nodes = metatronCenters(600, 300, mR);
      for (const [x, y] of nodes) strokeCircle(metaG, x, y, mR, ramp(x), 1.5, 0.2);
      const rings = [nodes.slice(1, 7), nodes.slice(7)];
      for (const ring of rings) {
        for (let i = 0; i < 6; i++) {
          const a = ring[i], b = ring[(i + 1) % 6];
          metaG.moveTo(a[0], a[1]).lineTo(b[0], b[1]);
          metaG.stroke({ width: 1.5, color: ramp((a[0] + b[0]) / 2), alpha: 0.2 });
        }
      }
      meta.addChild(metaG);

      const highlight = creamGlow(PIXI);
      highlight.x = 600;
      highlight.y = 280;
      highlight.scale.set(4.2);
      app.stage.addChild(flower, meta, highlight);

      let t = 0;
      app.ticker.add((ticker) => {
        const dt = Math.min(ticker.deltaMS / 1000, 0.05);
        t += dt * 0.12;
        flower.x = Math.sin(t) * 28;
        flower.y = Math.cos(t * 0.7) * 18;
        meta.x = Math.sin(t * 0.55) * 10;
        meta.y = Math.cos(t * 0.4) * 8;
        highlight.x = 600 + Math.sin(t * 0.5) * 16;
        highlight.y = 280 + Math.cos(t * 0.4) * 10;
      });
    }

    async function ready(logo, shot) {
      await Promise.all([
        logo.decode().catch(() => {}),
        shot ? shot.decode().catch(() => {}) : Promise.resolve(),
        new Promise((r) => setTimeout(r, 2000)),
      ]);
      document.title = 'OG_READY';
      window.ogReady = true;
    }

    const overlay = document.createElement('style');
    overlay.textContent = overlayCss;
    document.head.appendChild(overlay);

    const plugin = new URLSearchParams(location.search).get('plugin');
    const logo = document.getElementById('logo');
    const shot = document.getElementById('shot');
    const nameEl = document.getElementById('name');
    const nameStroke = nameEl.querySelector('.stroke');
    const nameFill = nameEl.querySelector('.fill');
    function setName(text) {
      nameStroke.textContent = text;
      nameFill.textContent = text;
    }

    if (!plugin) {
      document.body.classList.add('pack');
      document.documentElement.style.setProperty('--accent', '#f4ead0');
      setName('Stupid Audio');
      logo.src = 'https://audio.stupid.systems/img/icon-512.png';
      try { await packScene(); }
      catch (err) { console.info('fx: pack backdrop disabled:', err?.message || err); }
      await ready(logo, null);
    } else {
      const sources = await (await fetch('sources.json')).json();
      const src = sources[plugin];
      if (!src) throw new Error('unknown plugin: ' + plugin);

      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = src.style;
      document.head.appendChild(link);
      await new Promise((resolve, reject) => {
        link.onload = resolve;
        link.onerror = () => reject(new Error('style failed: ' + src.style));
      });
      document.head.appendChild(overlay);

      setName(plugin);
      logo.src = src.logo;
      shot.src = src.screenshot;
      document.documentElement.style.setProperty('--accent', getComputedStyle(nameEl).color);

      try { await import(src.background); }
      catch (err) { console.info('fx: backdrop disabled:', err?.message || err); }

      await ready(logo, shot);
    }
  </script>
</body>
</html>
