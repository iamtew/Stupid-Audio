<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Generator</title>
  <!-- Pack wordmark uses Beyonders, like the catalog hero. -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/beyonders">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="stack">
    <img id="logo" alt="">
    <h1 id="name">
      <!-- Plugin branch: single-line name with stroke + fill. -->
      <span class="stroke" aria-hidden="true"></span>
      <span class="fill"></span>
      <!-- Pack branch: catalog wordmark, per-word gradients + double outline. -->
      <span class="wordmark" aria-hidden="true">
        <span data-text="Stupid"><span class="fill-stupid">Stupid</span></span>
        <span data-text="Audio"><span class="fill-udio">Audio</span></span>
      </span>
    </h1>
  </div>
  <div id="frame"><img id="shot" alt=""></div>
  <script type="module">
    const overlayCss = `
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      #fx {
        position: fixed;
        inset: 0;
        width: 1200px;
        height: 630px;
        z-index: 0;
        pointer-events: none;
      }
      #logo {
        position: absolute;
        left: 10%;
        top: 33%;
        width: 351px;
        height: auto;
        object-fit: contain;
        transform: translateY(-50%);
        z-index: 1;
        filter: drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 60%, transparent));
      }
      #frame {
        position: absolute;
        left: 40%;
        top: 50%;
        width: 50%;
        transform: translateY(-50%);
        perspective: 1400px;
        z-index: 1;
      }
      #shot {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 0.75rem;
        border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
        box-shadow:
          -18px 18px 60px color-mix(in srgb, var(--accent) 35%, transparent),
          18px -12px 60px color-mix(in srgb, var(--accent2, var(--accent)) 25%, transparent),
          0 30px 60px #000a;
        transform-origin: left center;
        transform: rotateY(-8deg) rotateX(3deg);
      }
      #name {
        position: absolute;
        left: 50%;
        bottom: 28px;
        margin: 0;
        transform: translateX(-50%);
        z-index: 3;
        font-size: 108px;
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      #name .stroke,
      #name .fill { display: block; }
      #name .wordmark { display: none; }
      #name .stroke {
        position: absolute;
        left: 0;
        top: 0;
        color: #000;
        -webkit-text-stroke: 10px #000;
      }
      #name .fill {
        position: relative;
        filter:
          drop-shadow(0 0 4px #000)
          drop-shadow(0 0 18px color-mix(in srgb, var(--accent) 60%, transparent));
      }
      body.pack {
        background: #0b0b0f;
        color: #f4ead0;
        font: 18px/1.5 system-ui, sans-serif;
      }
      body.pack #frame { display: none; }
      body.pack #stack {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3rem;
        z-index: 1;
      }
      body.pack #logo,
      body.pack #name {
        position: static;
        transform: none;
        left: auto;
        top: auto;
        bottom: auto;
      }
      body.pack #logo { width: 280px; }

      /* Pack wordmark mirrors the catalog hero (css/style.css):
         Beyonders 400, per-word gradients with a silver + black double
         outline layered behind each word. */
      body.pack #name {
        font-family: Beyonders, system-ui, sans-serif;
        font-weight: 400;
        font-size: 72px;
        letter-spacing: -0.02em;
        white-space: normal;
      }
      body.pack #name .stroke,
      body.pack #name .fill { display: none; }
      body.pack #name .wordmark {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        align-items: baseline;
        gap: 0.22em;
      }
      body.pack #name .wordmark > [data-text] {
        --gap: 0.022em;
        --silver: 0.022em;
        position: relative;
      }
      body.pack #name .wordmark > [data-text]::before,
      body.pack #name .wordmark > [data-text]::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        color: transparent;
        -webkit-text-fill-color: transparent;
        pointer-events: none;
      }
      body.pack #name .wordmark > [data-text]::before {
        z-index: 0;
        -webkit-text-stroke: calc(2 * (var(--gap) + var(--silver))) #e0e0e0;
      }
      body.pack #name .wordmark > [data-text]::after {
        z-index: 0;
        -webkit-text-stroke: calc(2 * var(--gap)) #000;
      }
      body.pack #name .fill-stupid,
      body.pack #name .fill-udio {
        position: relative;
        z-index: 1;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      body.pack #name .fill-stupid {
        background-image: linear-gradient(90deg, #000000, #00ffff);
      }
      body.pack #name .fill-udio {
        background-image: linear-gradient(90deg, #ff00ff, #000000);
      }
    `;

    const PIXI_URL = 'https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs';
    const INK = 0x0b0b0f;

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const rand = (lo, hi) => lo + Math.random() * (hi - lo);

    // Pointer in 0..1 viewport units; heroScene parts around it. Defaults to
    // centre: headless captures have no pointer events.
    const pointer = { x: 0.5, y: 0.5 };
    addEventListener('pointermove', (e) => {
      pointer.x = e.clientX / innerWidth;
      pointer.y = e.clientY / innerHeight;
    }, { passive: true });

    // Soft white radial dot; tinted per sprite. Copied from js/fx.js.
    function glowTexture(PIXI, size = 64) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const r = size / 2;
      const grd = g.createRadialGradient(r, r, 0, r, r, r);
      grd.addColorStop(0, 'rgba(255,255,255,1)');
      grd.addColorStop(0.25, 'rgba(255,255,255,0.5)');
      grd.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      return PIXI.Texture.from(c);
    }

    function glowSprite(PIXI, tex, tint) {
      const s = new PIXI.Sprite(tex);
      s.anchor.set(0.5);
      s.tint = tint;
      s.blendMode = 'add';
      return s;
    }

    function wrap(s, w, h, m = 40) {
      if (s.x < -m) s.x += w + 2 * m; else if (s.x > w + m) s.x -= w + 2 * m;
      if (s.y < -m) s.y += h + 2 * m; else if (s.y > h + m) s.y -= h + 2 * m;
    }

    // Hero palette, copied from js/fx.js: five-color flow field.
    const C = {
      tewYellow: 0xe8c200,
      k1xOrange: 0xd94214,
      hkrMagenta: 0xff00ff,
      v4jbTeal: 0x6fc3b8,
      f4rtGreen: 0x02f53a,
    };

    // Hero scene copied from js/fx.js so the pack backdrop matches the site
    // without fetching fx.js. Keep in sync with the original.
    function heroScene(PIXI, glow, w0, h0, n) {
      const root = new PIXI.Container();
      const colors = [C.tewYellow, C.k1xOrange, C.hkrMagenta, C.v4jbTeal, C.f4rtGreen];
      const ps = [];
      for (let i = 0; i < n; i++) {
        const s = glowSprite(PIXI, glow, colors[i % 5]);
        s.x = rand(0, w0);
        s.y = rand(0, h0);
        // Mostly small streaks, with ~8% big soft bokeh for depth.
        const big = Math.random() < 0.08;
        s.size = big ? rand(1.2, 2.4) : rand(0.08, 0.3);
        s.alpha = big ? rand(0.05, 0.12) : rand(0.35, 0.85);
        s.speed = big ? rand(8, 20) : rand(25, 80);
        root.addChild(s);
        ps.push(s);
      }

      return {
        root,
        update(t, w, h, dt) {
          const px = pointer.x * w, py = pointer.y * h, r2 = 150 * 150;
          for (const s of ps) {
            const a = (Math.sin(s.x * 0.0025 + t * 0.15) + Math.cos(s.y * 0.003 - t * 0.1)) * Math.PI;
            let vx = Math.cos(a) * s.speed, vy = Math.sin(a) * s.speed;
            const dx = s.x - px, dy = s.y - py, d2 = dx * dx + dy * dy;
            if (d2 < r2) {
              const f = (1 - d2 / r2) * 400 / Math.sqrt(d2 + 1);
              vx += dx * f;
              vy += dy * f;
            }
            s.x += vx * dt;
            s.y += vy * dt;
            // Stretch along travel direction so dots read as light trails.
            s.rotation = Math.atan2(vy, vx);
            s.scale.set(s.size * 2.6, s.size);
            wrap(s, w, h);
          }
        },
      };
    }

    function creamGlow(PIXI) {
      const size = 256;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const r = size / 2;
      const grd = g.createRadialGradient(r, r, 0, r, r, r);
      grd.addColorStop(0, 'rgba(244,234,208,0.35)');
      grd.addColorStop(0.45, 'rgba(244,234,208,0.08)');
      grd.addColorStop(1, 'rgba(244,234,208,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, size, size);
      const s = new PIXI.Sprite(PIXI.Texture.from(c));
      s.anchor.set(0.5);
      s.blendMode = 'add';
      return s;
    }

    async function packScene() {
      const PIXI = await import(PIXI_URL);
      const app = new PIXI.Application();
      await app.init({
        canvas: document.getElementById('fx'),
        width: 1200,
        height: 630,
        backgroundColor: INK,
        antialias: true,
        preference: 'webgl',
      });

      // Same particle budget as the site: scales with canvas area, 120..500.
      const budget = clamp(Math.round((1200 * 630) / 4000), 120, 500);
      const glow = glowTexture(PIXI);
      const hero = heroScene(PIXI, glow, 1200, 630, budget);

      const highlight = creamGlow(PIXI);
      highlight.x = 600;
      highlight.y = 280;
      highlight.scale.set(4.2);
      app.stage.addChild(hero.root, highlight);

      let t = 0;
      app.ticker.add((ticker) => {
        const dt = Math.min(ticker.deltaMS / 1000, 0.05);
        t += dt;
        hero.update(t, 1200, 630, dt);
        highlight.x = 600 + Math.sin(t * 0.5) * 16;
        highlight.y = 280 + Math.cos(t * 0.4) * 10;
      });
    }

    async function ready(logo, shot) {
      await Promise.all([
        logo.decode().catch(() => {}),
        shot ? shot.decode().catch(() => {}) : Promise.resolve(),
        new Promise((r) => setTimeout(r, 2000)),
      ]);
      document.title = 'OG_READY';
      window.ogReady = true;
    }

    const overlay = document.createElement('style');
    overlay.textContent = overlayCss;
    document.head.appendChild(overlay);

    const plugin = new URLSearchParams(location.search).get('plugin');
    const logo = document.getElementById('logo');
    const shot = document.getElementById('shot');
    const nameEl = document.getElementById('name');
    const nameStroke = nameEl.querySelector('.stroke');
    const nameFill = nameEl.querySelector('.fill');
    function setName(text) {
      nameStroke.textContent = text;
      nameFill.textContent = text;
    }

    if (!plugin) {
      document.body.classList.add('pack');
      document.documentElement.style.setProperty('--accent', '#f4ead0');
      setName('Stupid Audio');
      logo.src = 'https://audio.stupid.systems/img/icon.png';
      try { await packScene(); }
      catch (err) { console.info('fx: pack backdrop disabled:', err?.message || err); }
      await ready(logo, null);
    } else {
      const sources = await (await fetch('sources.json')).json();
      const src = sources[plugin];
      if (!src) throw new Error('unknown plugin: ' + plugin);

      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = src.style;
      document.head.appendChild(link);
      await new Promise((resolve, reject) => {
        link.onload = resolve;
        link.onerror = () => reject(new Error('style failed: ' + src.style));
      });
      document.head.appendChild(overlay);

      setName(plugin);
      logo.src = src.logo;
      shot.src = src.screenshot;
      document.documentElement.style.setProperty('--accent', getComputedStyle(nameEl).color);

      try { await import(src.background); }
      catch (err) { console.info('fx: backdrop disabled:', err?.message || err); }

      await ready(logo, shot);
    }
  </script>
</body>
</html>
